<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#850000"><title>Fiche atelier · Workshop ID Card</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong class="brand" data-t="title"></strong><span id="saved" role="status"></span><label class="lang-pick" for="uiLang"><span data-t="lang"></span><select id="uiLang" data-lang><option value="fr">Français</option><option value="en">English</option></select></label></header>
<main id="editor"><section class="workarea"><form id="form" novalidate><div id="pages"></div><div id="errors" role="alert" tabindex="-1" hidden></div><div class="form-footer"><span id="progressText"></span><span class="draft-actions"><button id="saveJson" type="button" data-t="export"></button><label class="text-button" for="importJson"><span data-t="import"></span><input id="importJson" type="file" accept="application/json,.json" hidden></label></span><button class="primary" id="next" type="submit" data-t="generate"></button></div></form></section>
<aside class="preview"><button id="expand" class="canvas-preview" type="button"><canvas id="card" width="3096" height="1608"></canvas></button><div class="checklist" id="checklist"></div></aside></main>
<section id="result" hidden><div class="result-header"><h1 id="resultTitle"></h1><div class="result-actions"><button class="secondary" id="edit" data-t="edit"></button><button class="secondary" id="png" data-t="png"></button><button class="primary" id="print" data-t="pdf"></button></div></div><img id="resultImage" alt="Workshop ID Card"></section>
<dialog id="previewDialog"><div><strong data-t="title"></strong><button id="closePreview" class="secondary" data-t="close"></button></div><img id="largePreview" alt=""></dialog>
<footer class="site-footer"><span data-t="footer"></span><span><a href="https://www.geonames.org/" target="_blank" rel="noopener">GeoNames</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a></span></footer><div id="toast" role="status" hidden></div><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script type="module" src="app.js"></script></body></html>
