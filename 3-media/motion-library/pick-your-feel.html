<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pick Your Feel</title>
<script src="https://cdn.jsdelivr.net/npm/animejs/dist/bundles/anime.umd.min.js"></script>
<style>
:root{--bg:#faf7f4;--ink:#241f1d;--mute:#7a6f69;--line:#e9e1da;--card:#fff;--accent:#b5646f}
@media (prefers-color-scheme:dark){:root{--bg:#171413;--ink:#f3ece7;--mute:#a79c95;--line:#2d2826;--card:#211d1b;--accent:#e0919b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:28px 16px 80px}
h1{font-size:clamp(28px,5vw,44px);margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 26px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.mood{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.mood.picked{border-color:var(--accent)}
.mood h2{margin:0;font-size:20px}.words{color:var(--mute);font-size:14px;margin:0}
.stage{background:var(--bg);border-radius:12px;padding:14px;min-height:300px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.stage h3{margin:0;font-size:18px}
.svc{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;background:var(--card)}
.book{align-self:flex-start;background:var(--accent);color:#fff;border:0;border-radius:99px;padding:10px 20px;font-size:15px;cursor:pointer}
.row{display:flex;gap:8px;margin-top:auto}
.row button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:14px}
.row button.pick{background:var(--accent);color:#fff;border-color:var(--accent)}
.sum{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.sum code{display:block;white-space:pre-wrap;margin-top:8px;color:var(--mute)}
.note{color:var(--mute);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>Pick your feel</h1>
<p class="sub">Four ways the booking page could move. Watch each one, press Replay, hover the Book button, then mark what feels like her brand.</p>
<div class="grid" id="grid"></div>
<div class="sum"><b>Your picks</b><code id="out">Nothing picked yet.</code></div>
<p class="note">Sample content only. Timings are starting points to react to, not rules from any published system.</p>
</div>
<script>
const MOODS=[
 {id:"soft",name:"Soft & luxurious",words:"calm, slow, indulgent",ease:"outQuart",dur:1100,gap:140,y:24,scale:1,hover:1.03,hoverDur:600,ref:"Truekind, Shevet, Bio Medical Spa"},
 {id:"clean",name:"Clean & clinical",words:"quick, precise, trustworthy",ease:"outQuad",dur:220,gap:40,y:8,scale:1,hover:1.02,hoverDur:150,ref:"OMR Beauty, Cheeks + Co, Glasskin"},
 {id:"play",name:"Playful & modern",words:"bouncy, fun, energetic",ease:"outBack",dur:650,gap:90,y:30,scale:.85,hover:1.1,hoverDur:350,ref:"Deep Beauty, Visage Salon"},
 {id:"edit",name:"Editorial",words:"confident, dramatic, magazine-like",ease:"outExpo",dur:1000,gap:110,y:46,scale:1,hover:1.04,hoverDur:500,ref:"Anima Wellness, La Mamounia Spa"}
];
let picks={};try{picks=JSON.parse(localStorage.getItem("pyf")||"{}")}catch(e){}
const grid=document.getElementById("grid");
grid.innerHTML=MOODS.map(m=>`<section class="mood" id="m-${m.id}"><div><h2>${m.name}</h2><p class="words">${m.words} · like ${m.ref}</p></div>
<div class="stage" id="s-${m.id}"><h3 class="a">Book your lash lift</h3>
<div class="svc a"><span>Lash lift &amp; tint</span><b>$95</b></div><div class="svc a"><span>Signature facial</span><b>$120</b></div><div class="svc a"><span>Brow shaping</span><b>$45</b></div>
<div class="slots a"><span class="slot">10:00</span><span class="slot">11:30</span><span class="slot">1:00</span><span class="slot">3:30</span></div>
<button class="book a">Book now</button></div>
<div class="row"><button data-r="${m.id}">Replay</button><button data-p="${m.id}">This feels like her</button></div></section>`).join("");
function play(m){
  const sel=`#s-${m.id} .a`;
  document.querySelectorAll(sel).forEach(e=>{e.style.opacity=0});
  anime.animate(sel,{opacity:[0,1],translateY:[m.y,0],scale:[m.scale,1],duration:m.dur,ease:m.ease,delay:anime.stagger(m.gap)});
}
MOODS.forEach(m=>{
  const b=document.querySelector(`#s-${m.id} .book`);
  b.onmouseenter=()=>anime.animate(b,{scale:m.hover,duration:m.hoverDur,ease:m.ease});
  b.onmouseleave=()=>anime.animate(b,{scale:1,duration:m.hoverDur,ease:m.ease});
  play(m);
});
function paint(){
  MOODS.forEach(m=>{document.getElementById("m-"+m.id).classList.toggle("picked",!!picks[m.id]);
    document.querySelector(`[data-p="${m.id}"]`).classList.toggle("pick",!!picks[m.id])});
  const p=MOODS.filter(m=>picks[m.id]);
  document.getElementById("out").textContent=p.length?p.map(m=>`${m.name}: ${m.words} (${m.dur} ms, ${m.ease})`).join("\n"):"Nothing picked yet.";
}
grid.onclick=e=>{const r=e.target.dataset.r,p=e.target.dataset.p;
  if(r)play(MOODS.find(m=>m.id===r));
  if(p){picks[p]=!picks[p];try{localStorage.setItem("pyf",JSON.stringify(picks))}catch(x){}paint()}};
paint();
</script>
</body>
</html>
